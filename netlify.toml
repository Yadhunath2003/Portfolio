[build]
  command = "npm run build"
  publish = "dist"

# PostHog reverse proxy (US Cloud): the site sends analytics to /ingest on its
# own domain, which ad-blockers block far less often than posthog.com.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true
